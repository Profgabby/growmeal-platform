name: Marketplace development checks
on:
  push:
    branches: [feat/growmeal-marketplace-isolated]
  pull_request:
    paths:
      - 'app/marketplace-dev/**'
      - 'lib/marketplace/**'
      - 'tests/marketplace.test.mjs'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/marketplace.test.mjs
      - run: npm run build
      - name: Install browser test runner without changing lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Six-language browser acceptance
        run: npx playwright test
      - name: Upload browser failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: growmeal-browser-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
